name: Update README Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Language Stats
        run: |
          curl -o stats.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=fnz78&layout=compact&theme=radical"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add stats.svg
          git commit -m "🔄 Auto-update language stats" || echo "No changes"
          git push
