name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: fnz78
          token: ${{ secrets.GITHUB_TOKEN }}

          plugin_isocalendar: yes
          plugin_languages: yes
